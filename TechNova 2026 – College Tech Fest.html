<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TechNova 2026 – College Tech Fest</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config = { darkMode: 'class' };</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-behavior: smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 4rem); }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .glow { background: radial-gradient(60% 60% at 50% 0%, rgba(99,102,241,.35), transparent 70%); }
</style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors">
<div id="root"></div>
<script>
const { useState, useEffect, useMemo } = React;
const html = htm.bind(React.createElement);

// ---- Data ----
const EVENT_DATE = new Date('2026-12-18T09:00:00');
const EVENTS = [
  { id: 1, day: 1, time: '09:30', title: 'Inauguration & Keynote', cat: 'Talk', venue: 'Main Auditorium', icon: '🎤' },
  { id: 2, day: 1, time: '11:00', title: 'HackNova 24-hr Hackathon', cat: 'Hackathon', venue: 'Computer Lab 1', icon: '💻' },
  { id: 3, day: 1, time: '14:00', title: 'Intro to Generative AI', cat: 'Workshop', venue: 'Seminar Hall A', icon: '🤖' },
  { id: 4, day: 1, time: '16:30', title: 'Valorant Qualifiers', cat: 'Gaming', venue: 'Esports Arena', icon: '🎮' },
  { id: 5, day: 2, time: '10:00', title: 'Robo Wars', cat: 'Robotics', venue: 'Open Ground', icon: '🦾' },
  { id: 6, day: 2, time: '11:30', title: 'Web3 & Blockchain Basics', cat: 'Workshop', venue: 'Seminar Hall B', icon: '⛓️' },
  { id: 7, day: 2, time: '15:00', title: 'Startup Pitch Battle', cat: 'Talk', venue: 'Main Auditorium', icon: '🚀' },
  { id: 8, day: 2, time: '18:00', title: 'Hackathon Demo Round', cat: 'Hackathon', venue: 'Computer Lab 1', icon: '🏁' },
  { id: 9, day: 3, time: '10:00', title: 'Cybersecurity CTF Finals', cat: 'Hackathon', venue: 'Computer Lab 2', icon: '🔐' },
  { id: 10, day: 3, time: '13:00', title: 'Drone Racing Challenge', cat: 'Robotics', venue: 'Open Ground', icon: '🛸' },
  { id: 11, day: 3, time: '16:00', title: 'Valorant Grand Finals', cat: 'Gaming', venue: 'Esports Arena', icon: '🏆' },
  { id: 12, day: 3, time: '19:00', title: 'Closing Ceremony & DJ Night', cat: 'Cultural', venue: 'Main Stage', icon: '🎉' },
];
const CATS = ['All', ...Array.from(new Set(EVENTS.map(e => e.cat)))];
const DAYS = [{ v: 0, l: 'All days' }, { v: 1, l: 'Day 1 · 18 Dec' }, { v: 2, l: 'Day 2 · 19 Dec' }, { v: 3, l: 'Day 3 · 20 Dec' }];
const CAT_STYLE = {
  Talk: 'bg-sky-100 text-sky-700 dark:bg-sky-500/20 dark:text-sky-300',
  Hackathon: 'bg-violet-100 text-violet-700 dark:bg-violet-500/20 dark:text-violet-300',
  Workshop: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300',
  Gaming: 'bg-rose-100 text-rose-700 dark:bg-rose-500/20 dark:text-rose-300',
  Robotics: 'bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300',
  Cultural: 'bg-pink-100 text-pink-700 dark:bg-pink-500/20 dark:text-pink-300',
};

// ---- Hooks ----
function useTheme() {
  const [dark, setDark] = useState(() => {
    try { const s = localStorage.getItem('theme'); if (s) return s === 'dark'; } catch (e) {}
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  });
  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
  }, [dark]);
  return [dark, () => setDark(d => !d)];
}

function useCountdown(target) {
  const calc = () => Math.max(0, target - Date.now());
  const [ms, setMs] = useState(calc);
  useEffect(() => { const t = setInterval(() => setMs(calc()), 1000); return () => clearInterval(t); }, []);
  const s = Math.floor(ms / 1000);
  return { days: Math.floor(s / 86400), hours: Math.floor(s / 3600) % 24, minutes: Math.floor(s / 60) % 60, seconds: s % 60, done: ms === 0 };
}

// ---- Components ----
function Navbar({ dark, toggle }) {
  return html`
    <header class="sticky top-0 z-20 backdrop-blur bg-white/70 dark:bg-slate-950/70 border-b border-slate-200 dark:border-slate-800" style=${{ paddingTop: 'env(safe-area-inset-top, 0px)' }}>
      <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
        <a href="#top" class="font-extrabold tracking-tight text-lg">⚡ Tech<span class="text-indigo-500">Nova</span></a>
        <nav class="hidden sm:flex gap-6 text-sm font-medium text-slate-600 dark:text-slate-300">
          <a href="#countdown" class="hover:text-indigo-500">Countdown</a>
          <a href="#schedule" class="hover:text-indigo-500">Schedule</a>
          <a href="#register" class="hover:text-indigo-500">Register</a>
        </nav>
        <button onClick=${toggle} aria-label="Toggle dark mode" class="w-10 h-10 rounded-full border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-lg">
          ${dark ? '☀️' : '🌙'}
        </button>
      </div>
    </header>`;
}

function Box({ value, label }) {
  return html`
    <div class="flex-1 min-w-[4.5rem] rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm py-4 text-center">
      <div class="text-3xl sm:text-5xl font-extrabold tabular-nums">${String(value).padStart(2, '0')}</div>
      <div class="text-xs uppercase tracking-widest text-slate-500 dark:text-slate-400 mt-1">${label}</div>
    </div>`;
}

function Hero() {
  const c = useCountdown(EVENT_DATE);
  return html`
    <section id="top" class="glow">
      <div class="max-w-5xl mx-auto px-4 pt-16 pb-10 text-center">
        <p class="inline-block px-3 py-1 rounded-full text-xs font-semibold bg-indigo-100 text-indigo-700 dark:bg-indigo-500/20 dark:text-indigo-300">18–20 December 2026 · Main Campus</p>
        <h1 class="mt-5 text-4xl sm:text-6xl font-extrabold tracking-tight">TechNova <span class="text-indigo-500">2026</span></h1>
        <p class="mt-4 max-w-xl mx-auto text-slate-600 dark:text-slate-300">Three days of hackathons, workshops, robotics, esports and big ideas. Build something. Break something. Meet your people.</p>
        <div class="mt-8 flex gap-3 justify-center">
          <a href="#register" class="px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold shadow">Register now</a>
          <a href="#schedule" class="px-5 py-3 rounded-xl border border-slate-300 dark:border-slate-700 font-semibold hover:bg-slate-100 dark:hover:bg-slate-800">View schedule</a>
        </div>
        <div id="countdown" class="mt-12">
          <h2 class="text-sm uppercase tracking-widest text-slate-500 dark:text-slate-400 mb-4">${c.done ? 'The fest is live! 🎉' : 'Kick-off in'}</h2>
          <div class="flex gap-3 sm:gap-5 max-w-xl mx-auto">
            <${Box} value=${c.days} label="Days" />
            <${Box} value=${c.hours} label="Hours" />
            <${Box} value=${c.minutes} label="Mins" />
            <${Box} value=${c.seconds} label="Secs" />
          </div>
        </div>
      </div>
    </section>`;
}

function Pill({ active, onClick, children }) {
  return html`
    <button onClick=${onClick} class=${'px-3 py-1.5 rounded-full text-sm font-medium border transition ' + (active
      ? 'bg-indigo-600 border-indigo-600 text-white'
      : 'border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800')}>${children}</button>`;
}

function Schedule() {
  const [day, setDay] = useState(0);
  const [cat, setCat] = useState('All');
  const [q, setQ] = useState('');
  const list = useMemo(() => EVENTS.filter(e =>
    (day === 0 || e.day === day) && (cat === 'All' || e.cat === cat) &&
    (e.title + e.venue).toLowerCase().includes(q.toLowerCase())
  ), [day, cat, q]);

  return html`
    <section id="schedule" class="max-w-5xl mx-auto px-4 py-14">
      <h2 class="text-3xl font-extrabold">Event schedule</h2>
      <p class="text-slate-600 dark:text-slate-400 mt-1">Filter by day or category to plan your fest.</p>
      <div class="mt-6 space-y-3">
        <div class="flex flex-wrap gap-2">${DAYS.map(d => html`<${Pill} key=${d.v} active=${day === d.v} onClick=${() => setDay(d.v)}>${d.l}<//>`)}</div>
        <div class="flex flex-wrap gap-2">${CATS.map(c => html`<${Pill} key=${c} active=${cat === c} onClick=${() => setCat(c)}>${c}<//>`)}</div>
        <input value=${q} onInput=${e => setQ(e.target.value)} placeholder="Search events or venues…" class="w-full sm:w-80 px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div class="mt-6 grid gap-4 sm:grid-cols-2">
        ${list.map(e => html`
          <article key=${e.id} class="flex gap-4 p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm hover:-translate-y-0.5 hover:shadow-md transition">
            <div class="text-3xl">${e.icon}</div>
            <div class="flex-1">
              <div class="flex items-center justify-between gap-2">
                <span class=${'text-xs font-semibold px-2 py-0.5 rounded-full ' + CAT_STYLE[e.cat]}>${e.cat}</span>
                <span class="text-xs text-slate-500 dark:text-slate-400">Day ${e.day} · ${e.time}</span>
              </div>
              <h3 class="mt-2 font-bold">${e.title}</h3>
              <p class="text-sm text-slate-500 dark:text-slate-400">📍 ${e.venue}</p>
            </div>
          </article>`)}
      </div>
      ${list.length === 0 && html`<p class="mt-10 text-center text-slate-500 dark:text-slate-400">No events match your filters.</p>`}
    </section>`;
}

function Register() {
  const [email, setEmail] = useState('');
  const [sent, setSent] = useState(false);
  const submit = () => { if (/^\S+@\S+\.\S+$/.test(email)) setSent(true); };
  return html`
    <section id="register" class="max-w-5xl mx-auto px-4 pb-16">
      <div class="rounded-3xl bg-gradient-to-br from-indigo-600 to-violet-600 text-white p-8 sm:p-12 text-center">
        <h2 class="text-3xl font-extrabold">Don’t miss TechNova</h2>
        <p class="mt-2 text-indigo-100">Drop your college email and we’ll send your pass details.</p>
        ${sent
          ? html`<p class="mt-6 font-semibold">You’re on the list! 🎟️</p>`
          : html`<div class="mt-6 flex flex-col sm:flex-row gap-3 max-w-md mx-auto">
              <input type="email" value=${email} onInput=${e => setEmail(e.target.value)} placeholder="you@college.edu" class="flex-1 px-4 py-3 rounded-xl text-slate-900 focus:outline-none focus:ring-2 focus:ring-white" />
              <button onClick=${submit} class="px-5 py-3 rounded-xl bg-white text-indigo-700 font-semibold hover:bg-indigo-50">Get my pass</button>
            </div>`}
      </div>
    </section>`;
}

function App() {
  const [dark, toggle] = useTheme();
  return html`
    <div>
      <${Navbar} dark=${dark} toggle=${toggle} />
      <${Hero} />
      <${Schedule} />
      <${Register} />
      <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-sm text-slate-500 dark:text-slate-400">© 2026 TechNova · Organised by the Student Tech Council</footer>
    </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
